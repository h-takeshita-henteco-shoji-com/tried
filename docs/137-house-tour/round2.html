<script type="importmap">
{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================================
//  図面 (drawing.dxf) から読んだ寸法。単位 mm。
//  平面座標: X = 東向き(通り芯 X1=0), Y = 北向き(通り芯 Y1=0)
//  高さ: FL = 0（GL = -561）
// =====================================================================
const FL_GL   = 561;    // 立面図・断面図 GL→FL 561
const FDN_TOP = 400;    // 基礎天端 GL+400（立面図 基礎, 矩計図）
const CH      = 2400;   // 天井高 CH=2,400（A-A, B-B 断面図）
const EAVE    = 2750;   // FL→軒高 2,750（立面図・断面図・矩計図）
const SLOPE   = 0.4;    // 屋根勾配 4/10
const EAVE_OUT  = 600;  // 軒の出（通り芯から） 600（矩計図・A-A 断面図）
const VERGE_OUT = 300;  // けらばの出（通り芯から） 300（南北立面図・B-B 断面図）
const ROOF_T  = 150;    // 屋根厚（鉛直）150（立面図）
const RIDGE_Y = 3640;   // 棟 = Y3 通り（A-A 断面図・東西立面図）
const BW = 10010, BD = 7280;  // 通り芯 X1–X8 = 10,010 / Y1–Y6 = 7,280
const T_EXT = 150, T_INT = 120;  // 平面図 外壁 150 / 間仕切 120
const DOOR_H = 2000;    // 室内建具の高さ（建具表 WD-1〜6 = 2000）

// ---- 部屋（仕上表）。rects は通り芯で囲んだ範囲 [x0,y0,x1,y1]
const ROOMS = {
  ldk:    { name: 'LDK',        floor: 'flooring', skirt: 'wood', rects: [[0,0,4550,5460]],                                   tp: [2275,1500, 0.35] },
  genkan: { name: '玄関',       floor: 'tile',     skirt: null,   rects: [[4550,0,6370,1820]],                                tp: [5460, 700, 0] },
  hall:   { name: 'ホール',     floor: 'flooring', skirt: 'wood', rects: [[4550,1820,6370,3640],[5460,3640,6370,5460],[6370,3640,7280,4550]], tp: [5460,2500, 0] },
  bed1:   { name: '寝室1',      floor: 'flooring', skirt: 'wood', rects: [[6370,0,10010,3640]],                               tp: [7300,2900, -2.4] },
  closet: { name: 'クローゼット', floor: 'flooring', skirt: 'wood', rects: [[7280,3640,10010,4550]],                           tp: [8645,4100, Math.PI] },
  bed2:   { name: '寝室2',      floor: 'flooring', skirt: 'wood', rects: [[6370,4550,10010,7280]],                            tp: [7300,5100, -0.7] },
  wc:     { name: 'トイレ',     floor: 'cf',       skirt: 'soft', rects: [[4550,3640,5460,5460]],                             tp: [5005,5100, Math.PI] },
  senmen: { name: '洗面脱衣',   floor: 'cf',       skirt: 'soft', rects: [[2730,5460,4550,7280]],                             tp: [4200,5900, 1.2] },
  bath:   { name: '浴室',       floor: 'ub',       skirt: null,   rects: [[910,5460,2730,7280]],                              tp: [2300,5900, 0.8] },
  famicl: { name: 'ファミクロ', floor: 'flooring', skirt: 'wood', rects: [[4550,5460,6370,7280]],                             tp: [5460,6100, 0] },
  pantry: { name: 'パントリー', floor: 'flooring', skirt: 'wood', rects: [[0,5460,910,7280]],                                 tp: [462,5900, 0] },
};
function roomAt(x, y) {
  if (x < 0 || x > BW || y < 0 || y > BD) return null;
  for (const [k, r] of Object.entries(ROOMS))
    for (const [x0,y0,x1,y1] of r.rects) if (x >= x0 && x <= x1 && y >= y0 && y <= y1) return k;
  return null;
}

// ---- 壁。dir:'x' = X方向に走る壁（Y=c）, dir:'y' = Y方向に走る壁（X=c）
//  ops: 開口 {a,b: 壁方向の範囲, s: 下端(FL基準), h: 上端, k: 'win'|'door'|'extdoor'|'open'}
//  窓は建具表の記号 id と開き方 wt（hiki=引違い / tate=縦すべり出し / yoko=横すべり出し）、frost=型板ガラス
const W = [
  // 外壁（平面図 WALL 150、開口高さは立面図）
  { dir:'x', c:0,    a:-75, b:10085, t:T_EXT, ext:true, ops:[
      { a:400,  b:2050, s:0,   h:2000, k:'win', id:'AW-1', wt:'hiki' },   // LDK 掃き出し
      { a:2500, b:4150, s:0,   h:2000, k:'win', id:'AW-1', wt:'hiki' },   // LDK 掃き出し
      { a:5000, b:5900, s:0,   h:2200, k:'extdoor' },                     // 玄関ドア AD-1
      { a:7300, b:8950, s:900, h:2000, k:'win', id:'AW-2', wt:'hiki' } ]},// 寝室1
  { dir:'x', c:BD,   a:-75, b:10085, t:T_EXT, ext:true, ops:[
      { a:1500, b:2200, s:1400, h:1900, k:'win', id:'AW-5', wt:'yoko', frost:true },  // 浴室
      { a:3300, b:4000, s:1400, h:1900, k:'win', id:'AW-5', wt:'yoko', frost:true },  // 洗面脱衣
      { a:5100, b:5800, s:1400, h:1900, k:'win', id:'AW-5', wt:'yoko', frost:true },  // ファミクロ
      { a:7600, b:8800, s:900,  h:2000, k:'win', id:'AW-3', wt:'hiki' } ]},           // 寝室2
  { dir:'y', c:0,    a:75, b:7205, t:T_EXT, ext:true, gable:true, ops:[
      { a:1200, b:2400, s:900, h:2000, k:'win', id:'AW-3', wt:'hiki' },
      { a:2800, b:4000, s:900, h:2000, k:'win', id:'AW-3', wt:'hiki' },
      { a:4450, b:5200, s:0,   h:2000, k:'extdoor' } ]},                  // 勝手口 AD-2
  { dir:'y', c:BW,   a:75, b:7205, t:T_EXT, ext:true, gable:true, ops:[
      { a:1200, b:2400, s:900, h:2000, k:'win', id:'AW-3', wt:'hiki' },
      { a:6500, b:7100, s:900, h:2000, k:'win', id:'AW-4', wt:'tate' } ]},// 寝室2 縦すべり出し
  // 間仕切り（平面図 WALL 120）
  { dir:'y', c:4550, a:75,   b:7205, t:T_INT, ops:[ {a:2300,b:3100,k:'door'}, {a:5560,b:6260,k:'door'} ]},
  { dir:'y', c:6370, a:75,   b:3700, t:T_INT, ops:[ {a:2300,b:3100,k:'door'} ]},
  { dir:'y', c:6370, a:4490, b:7205, t:T_INT, ops:[] },
  { dir:'y', c:5460, a:3700, b:5400, t:T_INT, ops:[ {a:4620,b:5320,k:'door'} ]},
  { dir:'y', c:7280, a:3700, b:4490, t:T_INT, ops:[] },
  { dir:'y', c:2730, a:5520, b:7205, t:T_INT, ops:[ {a:5650,b:6350,k:'door'} ]},
  { dir:'y', c:910,  a:5520, b:7205, t:T_INT, ops:[] },
  { dir:'x', c:3640, a:4610, b:5520, t:T_INT, ops:[] },
  { dir:'x', c:3640, a:6430, b:9935, t:T_INT, ops:[ {a:7400,b:9900,k:'open'} ]},
  { dir:'x', c:4550, a:6430, b:9935, t:T_INT, ops:[ {a:6440,b:7210,k:'door'} ]},
  { dir:'x', c:5460, a:75,   b:4490, t:T_INT, ops:[ {a:100,b:800,k:'open'}, {a:3700,b:4400,k:'door'} ]},
  { dir:'x', c:5460, a:4610, b:6310, t:T_INT, ops:[ {a:5540,b:6300,k:'door'} ]},
];
for (const w of W) {
  w.z0 = w.ext ? FDN_TOP - FL_GL : 0;       // 外壁は基礎天端から
  w.z1 = w.ext ? EAVE : CH;                 // 外壁は軒高まで、間仕切りは天井まで
  for (const o of w.ops) { if (o.s === undefined) o.s = 0; if (o.h === undefined) o.h = DOOR_H; }
}

// ---- 開き戸（平面図 DOOR レイヤーの円弧: 吊り元 hx,hy / 閉じた向き closed / 開いた向き open、角度は平面で東=0°・北=90°）
const SWING = [
  { id:'AD-1', ext:true, hx:5000, hy:0,    w:900, h:2200, closed:0,   open:-90, rest:25 },  // 玄関（外開き）
  { id:'AD-2', ext:true, hx:0,    hy:5200, w:750, h:2000, closed:-90, open:180, rest:25 },  // 勝手口（外開き）
  { id:'WD-1',           hx:6370, hy:3100, w:800, h:2000, closed:-90, open:0,   rest:30 },  // 寝室1
  { id:'WD-2',           hx:6440, hy:4550, w:770, h:2000, closed:0,   open:90,  rest:30 },  // 寝室2
];
// ---- 片引き戸（平面図 DOOR レイヤーの戸の矩形: 閉じた位置 closed / 開いた位置 open。dir は戸が走る向き、v0–v1 は厚み方向）
const SLIDE = [
  { id:'WD-3', dir:'y', wc:4550, v0:4440, v1:4490, closed:[2270,3130], open:[3100,3900], glass:true },  // LDK（型板ガラス入り）
  { id:'WD-5', dir:'y', wc:5460, v0:5520, v1:5570, closed:[4590,5350], open:[3920,4620] },              // トイレ
  { id:'WD-6', dir:'x', wc:5460, v0:5520, v1:5570, closed:[3670,4430], open:[3000,3700] },              // 洗面脱衣（LDK側）
  { id:'WD-4', dir:'x', wc:5460, v0:5520, v1:5570, closed:[5510,6330], open:[4780,5540] },              // ファミクロ（鍵付き）
  { id:'WD-6', dir:'y', wc:4550, v0:4610, v1:4660, closed:[5530,6290], open:[6260,6960] },              // 洗面脱衣（ファミクロ側）
];
// ---- 平面図 FIXTURE レイヤー（ミニマップに描く輪郭。r=矩形 e=楕円 c=円 l=線）
const FIX2D = [
  {r:[4780,3700,5230,3900]}, {e:[5005,4175,190,275]},                         // 便器
  {r:[3700,6720,4450,7220]}, {e:[4075,6945,220,150]},                         // 洗面化粧台
  {r:[2850,6580,3490,7220]}, {c:[3170,6900,250]},                             // 洗濯機
  {r:[1000,6420,2640,7190]}, {r:[1080,6500,2560,7110]},                       // 浴槽
  {r:[1000,3200,3550,3850]}, {r:[1300,3330,2100,3720]},                       // キッチン・シンク
  {r:[1000,4750,2700,5400]}, {c:[1600,5075,150]}, {c:[2050,5075,150]},        // 背面収納・IH
  {r:[2850,4750,3500,5400]},                                                  // 冷蔵庫
  {l:[4610,1820,6310,1820]}, {r:[4610,60,4960,1760]},                         // 上がり框・下駄箱
  {l:[7280,4095,9935,4095]},                                                  // クローゼット パイプ
  {r:[9350,4610,9935,6400]}, {l:[9640,4610,9640,6400]},                       // 寝室2 収納
  {l:[4610,6370,6310,6370]}, {l:[4700,6950,6250,6950]},                       // ファミクロ パイプ・室内干し
  {l:[60,6370,850,6370]},                                                     // パントリー 棚
];

// =====================================================================
//  three.js
// =====================================================================
const S = 0.001;                        // mm → m
const P = (x, y, z) => new THREE.Vector3(x * S, z * S, -y * S);  // 平面(x,y)+高さz → world
const rad = d => d * Math.PI / 180;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfdde8);
scene.fog = new THREE.Fog(0xcfdde8, 60, 160);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 500);

const hemi = new THREE.HemisphereLight(0xffffff, 0xb8b0a0, 1.6);
const amb = new THREE.AmbientLight(0xffffff, 0);
scene.add(hemi, amb);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.copy(P(BW/2 + 9000, -14000, 16000));
sun.target.position.copy(P(BW/2, BD/2, 0));
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 60 });
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// =====================================================================
//  canvas で描く模様（画像ファイルは使わない）
// =====================================================================
function rng(seed) {
  return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const maxAniso = renderer.capabilities.getMaxAnisotropy();
// perU, perV: 模様 1 枚が実寸で何 m か（world UV 用）。null なら面ごとに 0–1 で貼る
function makeTex(w, h, perU, perV, seed, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h, rng(seed));
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (perU) t.repeat.set(1 / perU, 1 / perV);
  t.anisotropy = maxAniso;
  return t;
}
// 波打つ木目の線（横方向に周期的なので継ぎ目が出ない）
function grain(g, W, y0, h, r, n, rgb, vertical = false) {
  for (let k = 0; k < n; k++) {
    const base = y0 + r() * h, amp = 0.5 + r() * 2.5, f = (2 * Math.PI / W) * (1 + Math.floor(r() * 3)), ph = r() * 6.28;
    g.strokeStyle = `rgba(${rgb},${0.04 + r() * 0.14})`; g.lineWidth = 0.6 + r() * 1.8;
    g.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y = base + Math.sin(x * f + ph) * amp + Math.sin(x * f * 3 + ph * 2) * amp * 0.3;
      vertical ? (x ? g.lineTo(y, x) : g.moveTo(y, x)) : (x ? g.lineTo(x, y) : g.moveTo(x, y));
    }
    g.stroke();
  }
}
const TEX = {
  // フローリング: 幅 151.5（=909/6）× 長さ 1,820 の板、継ぎ目を乱に。1 枚 = 3.64m × 0.909m
  flooring: makeTex(2048, 512, 3.64, 0.909, 11, (g, W, H, r) => {
    const rows = 6, rh = H / rows;
    for (let i = 0; i < rows; i++) {
      const y0 = i * rh;
      g.fillStyle = `hsl(${29 + r() * 5}, ${42 + r() * 10}%, ${50 + r() * 8}%)`;
      g.fillRect(0, y0, W, rh);
      grain(g, W, y0, rh, r, 26, '95,55,25');
      const off = r() * W / 2;
      // 2 枚の板の色を少し変える
      g.fillStyle = r() < 0.5 ? 'rgba(255,240,220,0.10)' : 'rgba(60,30,10,0.08)';
      g.fillRect(off, y0, W / 2, rh);
      g.fillStyle = 'rgba(60,35,15,0.55)';
      g.fillRect(off - 1, y0, 2, rh); g.fillRect(off + W / 2 - 1, y0, 2, rh);
      g.fillStyle = 'rgba(55,32,14,0.6)'; g.fillRect(0, y0, W, 1.5);       // 板の目地（溝）
      g.fillStyle = 'rgba(255,235,210,0.25)'; g.fillRect(0, y0 + 1.5, W, 1);
    }
  }),
  // 磁器質タイル 300 角、目地 5。1 枚 = 0.6m 角（タイル 2×2）
  tile: makeTex(1024, 1024, 0.6, 0.6, 21, (g, W, H, r) => {
    g.fillStyle = '#b9b5ad'; g.fillRect(0, 0, W, H);                       // 目地
    const n = 2, s = W / n, jw = 5 / 600 * W;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const l = 52 + r() * 6;
      g.fillStyle = `hsl(35, 5%, ${l}%)`;
      g.fillRect(i * s + jw / 2, j * s + jw / 2, s - jw, s - jw);
      for (let k = 0; k < 900; k++) {                                     // 石目の粒
        g.fillStyle = `rgba(${r() < 0.5 ? '255,255,255' : '40,38,35'},${0.05 + r() * 0.12})`;
        g.fillRect(i * s + jw / 2 + r() * (s - jw), j * s + jw / 2 + r() * (s - jw), 1 + r() * 3, 1 + r() * 3);
      }
      g.fillStyle = 'rgba(0,0,0,0.12)';                                   // 目地際の影
      g.fillRect(i * s + jw / 2, j * s + s - jw / 2 - 2, s - jw, 2);
    }
  }),
  // 窯業系サイディング: 働き幅 455 の横張り。1 枚 = 0.91m × 0.91m（2 段）
  siding: makeTex(512, 512, 0.91, 0.91, 31, (g, W, H, r) => {
    g.fillStyle = '#ddd6c8'; g.fillRect(0, 0, W, H);
    for (let k = 0; k < 2500; k++) {
      g.fillStyle = `rgba(${r() < 0.5 ? '255,255,255' : '90,80,65'},${0.03 + r() * 0.06})`;
      g.fillRect(r() * W, r() * H, 1 + r() * 6, 1 + r() * 2);
    }
    for (let b = 0; b < 2; b++) {
      const y = b * H / 2;
      g.fillStyle = 'rgba(40,35,28,0.45)'; g.fillRect(0, y, W, 5);       // 横目地の影
      g.fillStyle = 'rgba(255,255,255,0.45)'; g.fillRect(0, y + 5, W, 2);
      g.fillStyle = 'rgba(0,0,0,0.05)'; g.fillRect(0, y + H / 4, W, 1);   // 板中央の浅い溝
    }
  }),
  // 立平葺き: 働き幅 455 ごとに縦はぜ。1 枚 = 0.455m × 1m
  roof: makeTex(256, 512, 0.455, 1.0, 41, (g, W, H, r) => {

const Ph = (c, o = {}) => new THREE.MeshPhongMaterial({ color: c, shininess: 60, ...o });

const MAT = {

// 壁は影を両面で落とす（裏面だけだと、室内の入隅に日が細く漏れて明るい線が出るため）
for (const k of ['cloth', 'clothC', 'ubWall', 'jamb', 'siding', 'skirtWood', 'skirtSoft']) MAT[k].shadowSide = THREE.DoubleSide;
const wallMatFor = (room) => room === null ? MAT.siding : room === 'bath' ? MAT.ubWall : MAT.cloth;

const groups = { house: new THREE.Group(), roof: new THREE.Group(), ceil: new THREE.Group(), labels: new THREE.Group() };
Object.values(groups).forEach(g => scene.add(g));

// 実寸で模様が揃うよう、面の向きに合わせて UV を world 座標(m)で付け直す
function worldUV(mesh, matrix) {
  const g = mesh.geometry, p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  const v = new THREE.Vector3(), nn = new THREE.Vector3(), nm = new THREE.Matrix3().getNormalMatrix(matrix);
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).applyMatrix4(matrix);
    nn.fromBufferAttribute(n, i).applyMatrix3(nm);
    const ax = Math.abs(nn.x), ay = Math.abs(nn.y), az = Math.abs(nn.z);
    if (ay >= ax && ay >= az) uv.setXY(i, v.x, -v.z);     // 床・屋根: u=東西, v=南北
    else if (ax >= az)        uv.setXY(i, -v.z, v.y);     // 東西を向く面: u=南北, v=高さ
    else                      uv.setXY(i, v.x, v.y);      // 南北を向く面: u=東西, v=高さ
  }
  uv.needsUpdate = true;
}
const needsWorldUV = (mat) => Array.isArray(mat) ? mat.some(m => m.userData.worldUV) : mat.userData.worldUV;

function box(x0, y0, z0, x1, y1, z1, mat, parent = groups.house) {
  const g = new THREE.BoxGeometry((x1 - x0) * S, (z1 - z0) * S, (y1 - y0) * S);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(P((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2));
  m.castShadow = m.receiveShadow = true;
  if (needsWorldUV(mat)) { m.updateMatrix(); worldUV(m, m.matrix); }
  parent.add(m);
  return m;
}
// 局所座標（mm、y が上）の箱。回転する建具・障子に使う
function lbox(parent, x0, x1, y0, y1, z0, z1, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry((x1 - x0) * S, (y1 - y0) * S, (z1 - z0) * S), mat);
  m.position.set((x0 + x1) / 2 * S, (y0 + y1) / 2 * S, (z0 + z1) / 2 * S);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
// 平面上の楕円柱（rx, ry は半径）。rTop は上端の縮み率
function ellCyl(cx, cy, rx, ry, z0, z1, mat, rTop = 1, parent = groups.house) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, 1, 1, 40), mat);
  m.scale.set(rx * S, (z1 - z0) * S, ry * S);
  m.position.copy(P(cx, cy, (z0 + z1) / 2));
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
// 水平の丸パイプ（平面の 2 点間）
function pipe(xa, ya, xb, yb, z, r, mat) {
  const a = P(xa, ya, z), b = P(xb, yb, z);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r * S, r * S, a.distanceTo(b), 16), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  m.castShadow = true;
  groups.house.add(m);
  return m;
}
// 断面形状 pts=[[planY, z],...] を X 方向に x0→x1 で押し出す
function prismX(pts, x0, x1, mat, parent) {
  const sh = new THREE.Shape(pts.map(([y, z]) => new THREE.Vector2(y * S, z * S)));
  const g = new THREE.ExtrudeGeometry(sh, { depth: (x1 - x0) * S, bevelEnabled: false });
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const sx = p.getX(i), sy = p.getY(i), sz = p.getZ(i);
    p.setXYZ(i, x0 * S + sz, sy, -sx);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.castShadow = m.receiveShadow = true;
  if (needsWorldUV(mat)) worldUV(m, new THREE.Matrix4());
  parent.add(m);
  return m;
}

// ---- 当たり判定（平面 mm の矩形）
const colliders = [];

// ---- 壁の生成
const roomEdgesX = new Set(), roomEdgesY = new Set();
Object.values(ROOMS).forEach(r => r.rects.forEach(([x0,y0,x1,y1]) => { roomEdgesX.add(x0); roomEdgesX.add(x1); roomEdgesY.add(y0); roomEdgesY.add(y1); }));

function buildWalls() { for (const w of W) {
  const h = w.t / 2;
  const edges = w.dir === 'x' ? roomEdgesX : roomEdgesY;
  const bp = new Set([w.a, w.b]);
  w.ops.forEach(o => { bp.add(o.a); bp.add(o.b); });
  edges.forEach(e => { if (e > w.a && e < w.b) bp.add(e); });
  const pts = [...bp].sort((p, q) => p - q);
  // 平面上の矩形 (u: 壁方向, v: 厚み方向)
  const rect = (u0, u1) => w.dir === 'x' ? [u0, w.c - h, u1, w.c + h] : [w.c - h, u0, w.c + h, u1];

  for (let i = 0; i < pts.length - 1; i++) {
    const u0 = pts[i], u1 = pts[i + 1], um = (u0 + u1) / 2;
    if (u1 - u0 < 1) continue;
    const op = w.ops.find(o => um > o.a && um < o.b);
    // 両側の部屋
    const off = h + 60;
    let roomNeg, roomPos;   // Neg: Y- 側(南) / X- 側(西)
    if (w.dir === 'x') { roomNeg = roomAt(um, w.c - off); roomPos = roomAt(um, w.c + off); }
    else               { roomNeg = roomAt(w.c - off, um); roomPos = roomAt(w.c + off, um); }
    const mNeg = wallMatFor(roomNeg), mPos = wallMatFor(roomPos);
    // BoxGeometry の面順: +x, -x, +y, -y, +z, -z  （world +z = 平面 南）
    // 木口（壁方向の両端の面）: 隣の箱や他の壁に接する面は描かない（真横から見ると線になってちらつくため）。
    // 開口に面する部分は下の reveal() で見込みの面を別に付ける。何にも接しない壁の端だけ描く
    const e0 = u0 === w.a ? endMat(w, w.a, -1) : MAT.none, e1 = u1 === w.b ? endMat(w, w.b, 1) : MAT.none;
    const mats = w.dir === 'x'
      ? [e1, e0, MAT.jamb, MAT.jamb, mNeg, mPos]
      : [mPos, mNeg, MAT.jamb, MAT.jamb, e0, e1];
    // 隣の箱とは 1mm、突き当たる相手の壁には 3mm 差し込んで、継ぎ目のすき間（細い線）を出さない。
    // 重なる面は同じ材料・同じ UV か、相手の壁の中に隠れるので見た目は変わらない
    const d0 = u0 > w.a ? 1 : e0 === MAT.none ? 3 : 0, d1 = u1 < w.b ? 1 : e1 === MAT.none ? 3 : 0;
    const [ox0, oy0, ox1, oy1] = rect(u0 - d0, u1 + d1);
    const spans = op ? [[w.z0, op.s], [op.h, w.z1]] : [[w.z0, w.z1]];
    const [x0, y0, x1, y1] = rect(u0, u1);
    for (const [za, zb] of spans) {
      if (zb - za < 1) continue;
      box(ox0, oy0, za, ox1, oy1, zb, mats);
      if (za < 1000) colliders.push({ x0, y0, x1, y1 });
      // 巾木（床から立ち上がる壁面のみ）
      if (za <= 0) {
        for (const [room, sgn] of [[roomNeg, -1], [roomPos, 1]]) {
          const sk = room && ROOMS[room].skirt;
          if (!sk) continue;
          const sm = sk === 'wood' ? MAT.skirtWood : MAT.skirtSoft;
          const f = w.c + sgn * h, f2 = f + sgn * 8;
          if (w.dir === 'x') box(u0, Math.min(f, f2), 0, u1, Math.max(f, f2), 60, sm);
          else               box(Math.min(f, f2), u0, 0, Math.max(f, f2), u1, 60, sm);
        }
      }
    }
    // 窓・外部ドア：通れないように当たり判定
    if (op && (op.k === 'win' || op.k === 'extdoor')) colliders.push({ x0, y0, x1, y1 });
  }
  // 窓（開口ごとに 1 回）・室内建具の枠・開口の見込み面
  for (const op of w.ops) {
    reveal(w, op.a, 1, op.s, op.h); reveal(w, op.b, -1, op.s, op.h);
    if (op.k === 'win') addWindow(w, op);
    if (op.k === 'door') addCasing(w, op);
    if (op.k === 'extdoor') addExtFrame(w, op);
  }
  // 妻壁（東西）：軒高から屋根下まで
  if (w.gable) {
    const pts2 = [[-75, EAVE], [RIDGE_Y, EAVE + SLOPE * RIDGE_Y], [BD + 75, EAVE]];
    prismX(pts2, w.c - h, w.c + h, MAT.siding, groups.roof);
  }
}
}  // buildWalls（下の補助関数を定義してから呼ぶ）

// 壁の端の先が他の壁の中なら木口は隠れる。外にはみ出す端は、外壁ならサイディング、室内ならクロス
function endMat(w, u, sg) {
  const p = u + sg * 2;
  const [x, y] = w.dir === 'x' ? [p, w.c] : [w.c, p];
  for (const o of W) {
    if (o === w) continue;
    const h = o.t / 2;
    const [x0, y0, x1, y1] = o.dir === 'x' ? [o.a, o.c - h, o.b, o.c + h] : [o.c - h, o.a, o.c + h, o.b];
    if (x > x0 && x < x1 && y > y0 && y < y1) return MAT.none;
  }
  return w.ext ? MAT.siding : MAT.cloth;
}
// 開口の側面（見込み）。sg=+1: 壁方向の + 向きの面（開口の始まり側）
function reveal(w, u, sg, z0, z1) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w.t * S, (z1 - z0) * S), MAT.jamb);
  m.position.copy(w.dir === 'x' ? P(u, w.c, (z0 + z1) / 2) : P(w.c, u, (z0 + z1) / 2));
  m.rotation.y = w.dir === 'x' ? sg * Math.PI / 2 : (sg > 0 ? Math.PI : 0);
  m.receiveShadow = true;
  groups.house.add(m);
}

// ---- 壁に沿った局所座標の箱 B(u0,u1, z0,z1, v0,v1)  u: 壁方向, v: 厚み方向（平面 +y / +x が正）
function wallBox(w) {
  return (u0, u1, z0, z1, va, vb, mat, parent) => {
    const v0 = Math.min(va, vb), v1 = Math.max(va, vb);
    return w.dir === 'x' ? box(u0, w.c + v0, z0, u1, w.c + v1, z1, mat, parent)
                         : box(w.c + v0, u0, z0, w.c + v1, u1, z1, mat, parent);
  };
}
// サッシ枠: 室内側の面だけ白（アルミ樹脂複合）
const frameMatCache = {};
function frameMats(w, ext) {
  const key = w.dir + ext;
  if (frameMatCache[key]) return frameMatCache[key];
  const a = Array(6).fill(MAT.frame);
  // 室内側 = 平面で -ext 向き。dir x: 面4 = 南(-y)、面5 = 北(+y) / dir y: 面0 = 東(+x)、面1 = 西(-x)
  if (w.dir === 'x') a[-ext > 0 ? 5 : 4] = MAT.frameIn; else a[-ext > 0 ? 0 : 1] = MAT.frameIn;
  return frameMatCache[key] = a;
}
// 壁方向・外向きの単位ベクトル（world）
const wallDirW = (w) => w.dir === 'x' ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, -1);
const extNormW = (w, ext) => w.dir === 'x' ? new THREE.Vector3(0, 0, -ext) : new THREE.Vector3(ext, 0, 0);
const planPt = (w, u, v, z) => w.dir === 'x' ? P(u, w.c + v, z) : P(w.c + v, u, z);

function addWindow(w, op) {
  const ext = w.c === 0 ? -1 : 1;           // 外側 = 平面で ext 向き
  const B = wallBox(w), FM = frameMats(w, ext);
  const { a, b, s, h } = op, FW = 50;
  const gm = op.frost ? MAT.frost : MAT.glass;
  // 枠（立面図: 枠外形 = 開口、見付 50）
  B(a, b, s, s + FW, -40, 40, FM); B(a, b, h - FW, h, -40, 40, FM);
  B(a, a + FW, s + FW, h - FW, -40, 40, FM); B(b - FW, b, s + FW, h - FW, -40, 40, FM);
  const glassBox = (...args) => { const m = B(...args); m.castShadow = false; return m; };
  // 障子（框 SW、見込 SD、中心 vc）
  const sash = (u0, u1, z0, z1, vc, SW, SD, parent) => {
    B(u0, u1, z0, z0 + SW, vc - SD / 2, vc + SD / 2, FM, parent); B(u0, u1, z1 - SW, z1, vc - SD / 2, vc + SD / 2, FM, parent);
    B(u0, u0 + SW, z0 + SW, z1 - SW, vc - SD / 2, vc + SD / 2, FM, parent); B(u1 - SW, u1, z0 + SW, z1 - SW, vc - SD / 2, vc + SD / 2, FM, parent);
    glassBox(u0 + SW, u1 - SW, z0 + SW, z1 - SW, vc - 3, vc + 3, gm, parent);
  };
  // 網戸（枠 + 網）
  const screen = (u0, u1, z0, z1, vc) => {
    const F = 22;
    B(u0, u1, z0, z0 + F, vc - 4, vc + 4, MAT.frame); B(u0, u1, z1 - F, z1, vc - 4, vc + 4, MAT.frame);
    B(u0, u0 + F, z0 + F, z1 - F, vc - 4, vc + 4, MAT.frame); B(u1 - F, u1, z0 + F, z1 - F, vc - 4, vc + 4, MAT.frame);
    glassBox(u0 + F, u1 - F, z0 + F, z1 - F, vc - 1, vc + 1, MAT.screen);
  };
  const z0 = s + FW, z1 = h - FW;
  if (op.wt === 'hiki') {
    // 引違い: 外障子（左）と内障子（右）が中央で重なる。外側に網戸、内障子にクレセント
    const m = (a + b) / 2, SW = 40;
    sash(a + FW, m + SW / 2, z0, z1, ext * 14, SW, 22);
    sash(m - SW / 2, b - FW, z0, z1, -ext * 14, SW, 22);
    B(m - SW / 2 + 4, m + SW / 2 - 4, (s + h) / 2 - 35, (s + h) / 2 + 35, -ext * 25, -ext * 40, MAT.metal);   // クレセント
    screen(m - SW / 2, b - FW, z0, z1, ext * 32);
    return;
  }
  // すべり出し: 障子を外へ少し押し出した状態。網戸は室内側
  screen(a + FW, b - FW, z0, z1, -ext * 30);
  const n = extNormW(w, ext);
  const piv = new THREE.Group(), inner = new THREE.Group();
  let hingePt;
  if (op.wt === 'tate') hingePt = planPt(w, a + FW, ext * 40, 0);       // 縦すべり出し: 吊り元を南側（仮）
  else                  hingePt = planPt(w, 0, ext * 40, z1);           // 横すべり出し: 上端を軸に下を外へ
  if (op.wt === 'yoko') hingePt[w.dir === 'x' ? 'x' : 'z'] = 0;
  piv.position.copy(hingePt);
  inner.position.copy(hingePt).negate();
  piv.add(inner); groups.house.add(piv);
  sash(a + FW, b - FW, z0, z1, ext * 25, 45, 30, inner);
  B((a + b) / 2 - 40, (a + b) / 2 + 40, z0 + 8, z0 + 40, -ext * 4, -ext * 20, MAT.frameIn, inner);  // 取っ手（カムラッチ）
  const TH = rad(op.wt === 'tate' ? 22 : 20);
  if (op.wt === 'tate') {
    const d = wallDirW(w);                                  // 吊り元から戸先へ
    piv.rotation.y = Math.sign(d.z * n.x - d.x * n.z) * TH;
  } else {
    if (w.dir === 'x') piv.rotation.x = -n.z * TH; else piv.rotation.z = n.x * TH;
  }
}

// 室内建具の枠（両面、見付 30・ちり 12）。枠は開口側へ 5 入れて壁の木口と面を揃えない
function addCasing(w, op) {

    B(op.a + 5, op.b - 5, op.h, op.h + 30, v0, v1, MAT.casing);

  B(op.a, op.b, op.h - 1, op.h, -h, h, MAT.casing);   // 上枠の見込み
}
// 外部ドアの枠（見付 40）
function addExtFrame(w, op) {

// 窓付きの戸板（局所座標 x: 幅, y: 高さ, z: 厚み）
function leaf(parent, x0, x1, y0, y1, t, mat, win, gmat) {
  if (!win) return lbox(parent, x0, x1, y0, y1, -t / 2, t / 2, mat);
  const [wx0, wx1, wy0, wy1] = win;
  lbox(parent, x0, wx0, y0, y1, -t / 2, t / 2, mat);
  lbox(parent, wx1, x1, y0, y1, -t / 2, t / 2, mat);
  lbox(parent, wx0, wx1, y0, wy0, -t / 2, t / 2, mat);
  lbox(parent, wx0, wx1, wy1, y1, -t / 2, t / 2, mat);
  lbox(parent, wx0, wx1, wy0, wy1, -3, 3, gmat).castShadow = false;
}
function lever(parent, x, y, z, toward) {
  const s = Math.sign(z);
  const rose = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.01, 20), MAT.metal);
  rose.rotation.x = Math.PI / 2; rose.position.set(x * S, y * S, z * S); parent.add(rose);
  lbox(parent, x - 6, x + 6, y - 6, y + 6, z, z + s * 45, MAT.metal);
  lbox(parent, Math.min(x, x + toward * 120), Math.max(x, x + toward * 120), y - 9, y + 9, z + s * 38, z + s * 56, MAT.metal);
}

    lbox(piv, L - 130, L - 105, 500, 1500, t / 2 + 45, t / 2 + 70, MAT.metal);                                                  // 縦長の取っ手（屋外）
    lbox(piv, L - 125, L - 110, 560, 580, t / 2, t / 2 + 45, MAT.metal); lbox(piv, L - 125, L - 110, 1420, 1440, t / 2, t / 2 + 45, MAT.metal);
    lbox(piv, L - 140, L - 95, 1050, 1150, t / 2, t / 2 + 8, MAT.black);                                                       // 電子錠
    lever(piv, L - 90, 1000, -t / 2, -1);

}

// ---- 片引き戸（壁の面に付く上吊り）

// 箱物の収納（face: 扉の向き 'N','S','E','W'。nDoor: 扉の枚数）
function cabinet(x0, y0, x1, y1, H, face, nDoor, doorMat = MAT.cab, topMat = MAT.counter, drawer = true) {
  const plinth = 80, top = 30, ins = 50;
  const [fx0, fy0, fx1, fy1] = face === 'N' ? [x0, y0, x1, y1 - ins] : face === 'S' ? [x0, y0 + ins, x1, y1]
                              : face === 'E' ? [x0, y0, x1 - ins, y1] : [x0 + ins, y0, x1, y1];
  box(fx0, fy0, 0, fx1, fy1, plinth, MAT.cabLine);
  box(x0, y0, plinth, x1, y1, H - top, doorMat);
  box(x0, y0, H - top, x1, y1, H, topMat);
  // 扉の目地と取っ手
  const along = face === 'N' || face === 'S';
  const u0 = along ? x0 : y0, u1 = along ? x1 : y1;
  const fv = face === 'N' ? y1 : face === 'S' ? y0 : face === 'E' ? x1 : x0;
  const sg = face === 'N' || face === 'E' ? 1 : -1;
  const F = (ua, ub, za, zb, d0, d1, mat) => along
    ? box(ua, Math.min(fv + sg * d0, fv + sg * d1), za, ub, Math.max(fv + sg * d0, fv + sg * d1), zb, mat)
    : box(Math.min(fv + sg * d0, fv + sg * d1), ua, za, Math.max(fv + sg * d0, fv + sg * d1), ub, zb, mat);
  const dw = (u1 - u0) / nDoor;
  for (let i = 1; i < nDoor; i++) F(u0 + i * dw - 2, u0 + i * dw + 2, plinth, H - top, -1, 1, MAT.cabLine);
  const zH = drawer ? H - top - 180 : H - top - 120;
  if (drawer) F(u0, u1, zH - 2, zH + 2, -1, 1, MAT.cabLine);
  for (let i = 0; i < nDoor; i++) {
    const c = u0 + (i + 0.5) * dw;
    F(c - Math.min(150, dw * 0.3), c + Math.min(150, dw * 0.3), zH - 40, zH - 25, 0, 14, MAT.steelDk);
  }
}

    c.position.copy(P((x0 + x1) / 2, (y0 + y1) / 2, CH));
    groups.ceil.add(c);
  }
}

// ---- 基礎・地面
// 以前は「床下」の箱が外壁と同じ面（外壁の外面）で GL+400〜FL に重なり、基礎と外壁の境に縞（Zファイティング）が出ていた。
// 床下の箱をやめ、基礎（天端 GL+400 まで）と外壁（基礎天端から）は面が重ならないようにし、境に土台水切りを付ける。
box(-75, -75, -FL_GL, 10085, 7355, FDN_TOP - FL_GL, MAT.fdn);
box(-92, -92, FDN_TOP - FL_GL - 20, 10102, 7372, FDN_TOP - FL_GL + 12, MAT.mizukiri);   // 土台水切り（壁から 17 出す）
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), MAT.ground);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -FL_GL * S - 0.002;
ground.receiveShadow = true;
scene.add(ground);
// 玄関ポーチ（ドア前の踏み場）
box(4800, -900, -FL_GL, 6100, -92, -FL_GL + 150, MAT.fdn);

// ---- 屋根（切妻 4/10、軒の出 600、けらば 300、厚 150）
{
  const zEdge = EAVE - SLOPE * EAVE_OUT;            // 軒先 下端 2,510
  const zRidge = EAVE + SLOPE * RIDGE_Y;            // 棟 下端 4,206
  const x0 = -VERGE_OUT, x1 = BW + VERGE_OUT;
  prismX([[-EAVE_OUT, zEdge], [RIDGE_Y, zRidge], [RIDGE_Y, zRidge + ROOF_T], [-EAVE_OUT, zEdge + ROOF_T]], x0, x1, MAT.roof, groups.roof);
  prismX([[BD + EAVE_OUT, zEdge], [BD + EAVE_OUT, zEdge + ROOF_T], [RIDGE_Y, zRidge + ROOF_T], [RIDGE_Y, zRidge]], x0, x1, MAT.roof, groups.roof);
  // 鼻隠し 24×180（矩計図）
  box(x0, -EAVE_OUT - 24, zEdge - 76, x1, -EAVE_OUT, zEdge + 104, MAT.fascia, groups.roof);
  box(x0, BD + EAVE_OUT, zEdge - 76, x1, BD + EAVE_OUT + 24, zEdge + 104, MAT.fascia, groups.roof);
  // 棟包み
  box(x0, RIDGE_Y - 60, zRidge + ROOF_T - 20, x1, RIDGE_Y + 60, zRidge + ROOF_T + 40, MAT.fascia, groups.roof);
}

// ---- 部屋名ラベル（屋根を隠したときに表示）
function label(text) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.85)'; g.beginPath(); g.roundRect(4, 8, 248, 48, 12); g.fill();
  g.fillStyle = '#223'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 128, 33);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, depthTest: false }));
  sp.scale.set(1.6, 0.4, 1);
  return sp;
}
for (const r of Object.values(ROOMS)) {
  const s = label(r.name);
  s.position.copy(P(r.tp[0], r.tp[1], 2600));
  groups.labels.add(s);
}
groups.labels.visible = false;

// =====================================================================
//  モード
// =====================================================================
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.copy(P(BW / 2, BD / 2, 1000));
orbit.enableDamping = true;
orbit.maxPolarAngle = Math.PI * 0.49;
orbit.minDistance = 4; orbit.maxDistance = 60;

let mode = 'pers';
const tour = { x: 0, y: 0, yaw: 0, pitch: 0 };
const EYE = 1500, RADIUS = 200;
const keys = {};
const persView = { pos: P(BW / 2 + 13000, -13000, 9000), tgt: P(BW / 2, BD / 2, 1000) };

const $ = id => document.getElementById(id);
const roomsDiv = $('rooms');
for (const [k, r] of Object.entries(ROOMS)) {
  const b = document.createElement('button');
  b.textContent = r.name; b.dataset.room = k;
  b.onclick = () => { setMode('tour'); goRoom(k); b.blur(); };
  roomsDiv.appendChild(b);
}
$('btnPers').onclick = () => setMode('pers');
$('btnTour').onclick = () => setMode('tour');
$('chkRoof').onchange = applyVisibility;

function applyVisibility() {
  const hide = mode === 'pers' && $('chkRoof').checked;
  groups.roof.visible = !hide;
  groups.ceil.visible = !hide;
  groups.labels.visible = hide;
}

function setMode(m) {
  if (m === mode && m === 'tour') return;
  mode = m;
  $('btnPers').classList.toggle('on', m === 'pers');
  $('btnTour').classList.toggle('on', m === 'tour');
  $('roofWrap').style.display = m === 'pers' ? 'block' : 'none';
  $('cross').style.display = m === 'tour' ? 'block' : 'none';
  $('where').style.display = m === 'tour' ? 'block' : 'none';
  $('miniWrap').style.display = m === 'tour' ? 'block' : 'none';
  orbit.enabled = m === 'pers';
  if (m === 'pers') {
    if (document.pointerLockElement) document.exitPointerLock();
    camera.position.copy(persView.pos); orbit.target.copy(persView.tgt); orbit.update();
    camera.fov = 50;
  } else {
    persView.pos.copy(camera.position); persView.tgt.copy(orbit.target);
    camera.fov = 70;
    goRoom('genkan');
  }
  amb.intensity = m === 'tour' ? 1.3 : 0;   // 室内は屋根の影で暗くなるので補う
  camera.updateProjectionMatrix();
  applyVisibility();
  updateHelp();
}

function goRoom(k) {
  const r = ROOMS[k];
  tour.x = r.tp[0]; tour.y = r.tp[1]; tour.yaw = r.tp[2]; tour.pitch = 0;
}

function updateHelp() {
  $('help').innerHTML = mode === 'pers'
    ? `<b>パース（外観）の操作</b>
       左ドラッグ: 回転<br>右ドラッグ / Shift+ドラッグ: 平行移動<br>ホイール: 拡大・縮小<br>
       「屋根と天井を隠す」で間取りを上から見られます<br>部屋のボタン: 室内ツアーでその部屋へ`
    : `<b>室内ツアーの操作（目の高さ FL+1,500）</b>
       <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>↓</kbd>: 前後・左右に歩く<br>
       <kbd>←</kbd><kbd>→</kbd> / <kbd>Q</kbd><kbd>E</kbd>: 向きを変える<br>
       <kbd>Shift</kbd>: 速く歩く<br>
       マウス ドラッグ: 見回す（画面をダブルクリックでマウス固定、<kbd>Esc</kbd>で解除）<br>
       室内の扉は近づくと開きます（外部の扉と窓は通れません）<br>
       右上の平面図: 赤い点が今いる場所と向き。クリックでその場所へ移動`;
}

// ---- 入力
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (mode === 'tour' && e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let dragging = false, lastX = 0, lastY = 0;
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', e => { if (mode === 'tour') { dragging = true; lastX = e.clientX; lastY = e.clientY; } });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (mode !== 'tour') return;
  let dx = 0, dy = 0;
  if (document.pointerLockElement === cvs) { dx = e.movementX; dy = e.movementY; }
  else if (dragging) { dx = e.clientX - lastX; dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; }
  else return;
  tour.yaw -= dx * 0.004;
  tour.pitch = Math.max(-1.3, Math.min(1.3, tour.pitch - dy * 0.004));
});
cvs.addEventListener('dblclick', () => { if (mode === 'tour' && cvs.requestPointerLock) cvs.requestPointerLock(); });

// ---- 衝突判定（円 vs 矩形）
function blocked(x, y) {
  for (const c of colliders) {
    const nx = Math.max(c.x0, Math.min(x, c.x1)), ny = Math.max(c.y0, Math.min(y, c.y1));
    if ((x - nx) ** 2 + (y - ny) ** 2 < RADIUS * RADIUS) return true;
  }
  return false;
}

// =====================================================================
//  ミニマップ（平面図。北が上）
// =====================================================================
const MM = { W: 270, pad: 380 };
MM.s = MM.W / (BW + 2 * MM.pad); MM.H = Math.round((BD + 2 * MM.pad) * MM.s);
const mmX = x => (x + MM.pad) * MM.s, mmY = y => (BD + MM.pad - y) * MM.s;
const mini = $('mini'), dpr = Math.min(devicePixelRatio, 2);
mini.width = MM.W * dpr; mini.height = MM.H * dpr; mini.style.width = MM.W + 'px'; mini.style.height = MM.H + 'px';
const mctx = mini.getContext('2d');
const mbase = document.createElement('canvas'); mbase.width = mini.width; mbase.height = mini.height;
{
  const g = mbase.getContext('2d'); g.scale(dpr, dpr);
  g.fillStyle = '#f7f7f4'; g.fillRect(0, 0, MM.W, MM.H);
  const FLOORC = { flooring: '#ecdcc2', tile: '#d3cfc8', cf: '#efe9da', ub: '#dbe7ee' };
  const R = (x0, y0, x1, y1) => [mmX(x0), mmY(y1), (x1 - x0) * MM.s, (y1 - y0) * MM.s];
  for (const r of Object.values(ROOMS)) { g.fillStyle = FLOORC[r.floor]; for (const q of r.rects) g.fillRect(...R(...q)); }
  // 設備
  g.strokeStyle = '#8c8c8c'; g.lineWidth = 0.8;
  for (const f of FIX2D) {
    g.beginPath();
    if (f.r) g.rect(...R(...f.r));
    if (f.e) g.ellipse(mmX(f.e[0]), mmY(f.e[1]), f.e[2] * MM.s, f.e[3] * MM.s, 0, 0, 7);
    if (f.c) g.arc(mmX(f.c[0]), mmY(f.c[1]), f.c[2] * MM.s, 0, 7);
    if (f.l) { g.moveTo(mmX(f.l[0]), mmY(f.l[1])); g.lineTo(mmX(f.l[2]), mmY(f.l[3])); }
    g.stroke();
  }
  // 建具（開き戸の軌跡・引き戸）
  g.strokeStyle = '#9a8f80'; g.lineWidth = 0.8;
  for (const d of SWING) {
    const delta = ((d.open - d.closed + 540) % 360) - 180;
    g.beginPath();
    for (let i = 0; i <= 16; i++) { const a = rad(d.closed + delta * i / 16);
      const x = mmX(d.hx + Math.cos(a) * d.w), y = mmY(d.hy + Math.sin(a) * d.w); i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.lineTo(mmX(d.hx), mmY(d.hy)); g.stroke();
  }
  g.fillStyle = '#b39c7c';
  for (const d of SLIDE) g.fillRect(...(d.dir === 'x' ? R(d.closed[0], d.v0, d.closed[1], d.v1) : R(d.v0, d.closed[0], d.v1, d.closed[1])));
  // 壁（開口を抜く）と窓
  for (const w of W) {
    const h = w.t / 2, ops = [...w.ops].sort((p, q) => p.a - q.a);
    const seg = (u0, u1, fill) => { if (u1 <= u0) return; g.fillStyle = fill;
      g.fillRect(...(w.dir === 'x' ? R(u0, w.c - h, u1, w.c + h) : R(w.c - h, u0, w.c + h, u1))); };
    let u = w.a;
    for (const o of ops) {
      seg(u, o.a, '#3a3a3a');
      if (o.k === 'win') { seg(o.a, o.b, o.frost ? '#c7d3da' : '#9ccbe6'); }
      u = o.b;
    }
    seg(u, w.b, '#3a3a3a');
  }
  // 室名
  g.fillStyle = '#4a4a4a'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const r of Object.values(ROOMS)) {
    const [x0, y0, x1, y1] = r.rects[0], wpx = (x1 - x0) * MM.s, name = r.name;
    const cx = mmX((x0 + x1) / 2), cy = mmY((y0 + y1) / 2);
    if (wpx >= name.length * 9.5) { g.font = '9px sans-serif'; g.fillText(name, cx, cy); }
    else { g.font = '8px sans-serif'; [...name].forEach((ch, i) => g.fillText(ch, cx, cy + (i - (name.length - 1) / 2) * 8.5)); }
  }
  g.font = '9px sans-serif'; g.fillStyle = '#777'; g.fillText('南（道路側）', MM.W / 2, MM.H - 5);
}
function drawMini() {
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.drawImage(mbase, 0, 0);
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const x = mmX(tour.x), y = mmY(tour.y);
  const fwd = Math.atan2(-Math.cos(tour.yaw), -Math.sin(tour.yaw));  // canvas 上の前方の角度（y 下向き）
  const half = Math.atan(Math.tan(rad(camera.fov / 2)) * camera.aspect);   // 横の画角の半分
  const grd = mctx.createRadialGradient(x, y, 2, x, y, 40);
  grd.addColorStop(0, 'rgba(220,40,40,0.45)'); grd.addColorStop(1, 'rgba(220,40,40,0)');
  mctx.fillStyle = grd;
  mctx.beginPath(); mctx.moveTo(x, y); mctx.arc(x, y, 40, fwd - half, fwd + half); mctx.closePath(); mctx.fill();
  mctx.fillStyle = '#d42a2a'; mctx.strokeStyle = '#fff'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.arc(x, y, 4.5, 0, 7); mctx.fill(); mctx.stroke();
}
mini.addEventListener('click', e => {
  const rc = mini.getBoundingClientRect();
  const px = (e.clientX - rc.left) / MM.s - MM.pad, py = BD + MM.pad - (e.clientY - rc.top) / MM.s;
  if (roomAt(px, py) && !blocked(px, py)) { tour.x = px; tour.y = py; }
});

function stepTour(dt) {
  const turn = ((keys.ArrowLeft || keys.KeyQ) ? 1 : 0) - ((keys.ArrowRight || keys.KeyE) ? 1 : 0);
  tour.yaw += turn * 1.8 * dt;
  const fwd = ((keys.KeyW || keys.ArrowUp) ? 1 : 0) - ((keys.KeyS || keys.ArrowDown) ? 1 : 0);
  const side = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const speed = (keys.ShiftLeft || keys.ShiftRight ? 2600 : 1300) * dt;
  // world 前方 = (-sin yaw, -cos yaw) → 平面 (dx, dy) = (-sin, +cos)
  const fx = -Math.sin(tour.yaw), fy = Math.cos(tour.yaw);
  const rx = Math.cos(tour.yaw), ry = Math.sin(tour.yaw);
  let dx = (fx * fwd + rx * side), dy = (fy * fwd + ry * side);
  const len = Math.hypot(dx, dy);
  if (len > 0) {
    dx = dx / len * speed; dy = dy / len * speed;
    // 小刻みに動かしてすり抜けを防ぐ
    const n = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 40);
    for (let i = 0; i < n; i++) {
      if (!blocked(tour.x + dx / n, tour.y)) tour.x += dx / n;
      if (!blocked(tour.x, tour.y + dy / n)) tour.y += dy / n;
    }
  }
  camera.position.copy(P(tour.x, tour.y, EYE));
  camera.rotation.set(tour.pitch, tour.yaw, 0, 'YXZ');
  const k = roomAt(tour.x, tour.y);
  $('where').textContent = k ? ROOMS[k].name : '—';
  roomsDiv.querySelectorAll('button').forEach(b => b.classList.toggle('here', b.dataset.room === k));
  drawMini();
}

// 扉: ふだんは少し開いた状態。室内ツアーで近づくと開く
function stepDoors(dt) {
  for (const d of doorAnims) {
    const near = mode === 'tour' && d.auto && Math.hypot(tour.x - d.cx, tour.y - d.cy) < 1500;
    const target = near ? 1 : d.rest;
    d.cur += (target - d.cur) * Math.min(1, dt * 5);
    d.apply(d.cur);
  }
}

// ---- ループ
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (mode === 'pers') orbit.update(); else stepTour(dt);
  stepDoors(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

doorAnims.forEach(d => d.apply(d.cur));
camera.position.copy(persView.pos); orbit.target.copy(persView.tgt); orbit.update();
setMode('pers');
updateHelp();
loop();
window.__house = { camera, orbit, tour, setMode, goRoom, doorAnims, stepDoors, renderer, scene, THREE, P };  // デバッグ用
</script>
</body>
</html>
