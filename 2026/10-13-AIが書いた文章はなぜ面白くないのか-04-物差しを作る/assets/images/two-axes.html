<text x="40" y="52" font-size="28" font-weight="700">文章を、構成と文の2つの軸で評価する</text>
<text x="40" y="84" font-size="16" fill="#666">例:「コードは設計である」(原文)を、役割を担う文に分けた模式図。数値はまだ測っていない</text>
<rect x="30" y="120" width="1180" height="430" rx="14" fill="none" stroke="#c9d1d6" stroke-width="2"/><text x="56" y="160" font-size="22" font-weight="700" fill="#3b6ea5">構成の軸 ― 文と文の関連を評価する</text><text x="56" y="188" font-size="15" fill="#666">役割の文がそろっているか、どうつながっているかを見る。文章だけを見て決める(AIが文の役割を見分ける)</text><path d="M126.0,370 C126.0,220 702.0,220 702.0,370" fill="none" stroke="#3b6ea5" stroke-width="2.5"/><polygon points="696.0,358 708.0,358 702.0,370" fill="#3b6ea5"/><text x="414.0" y="251.5" font-size="14" fill="#3b6ea5" font-weight="700" text-anchor="middle">予想を作る</text><path d="M270.0,370 C270.0,275 702.0,275 702.0,370" fill="none" stroke="#3b6ea5" stroke-width="2.5"/><polygon points="696.0,358 708.0,358 702.0,370" fill="#3b6ea5"/><path d="M414.0,370 C414.0,325 558.0,325 558.0,370" fill="none" stroke="#2e8b57" stroke-width="2.5"/><polygon points="552.0,358 564.0,358 558.0,370" fill="#2e8b57"/><text x="484.0" y="330.25" font-size="14" fill="#2e8b57" font-weight="700" text-anchor="middle">理由を渡す</text><path d="M846.0,370 C846.0,310 990.0,310 990.0,370" fill="none" stroke="#d2691e" stroke-width="2.5"/><polygon points="984.0,358 996.0,358 990.0,370" fill="#d2691e"/><text x="918.0" y="319.0" font-size="14" fill="#d2691e" font-weight="700" text-anchor="middle">答える</text><path d="M414.0,434 C414.0,494 702.0,494 702.0,434" fill="none" stroke="#2e8b57" stroke-width="2.5"/><polygon points="696.0,446 708.0,446 702.0,434" fill="#2e8b57"/><text x="558.0" y="495.0" font-size="14" fill="#2e8b57" font-weight="700" text-anchor="middle">理由を渡す(転より前に置く)</text><rect x="60" y="370" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="126.0" y="396" font-size="17" font-weight="700" text-anchor="middle">起</text><text x="126.0" y="420" font-size="13" fill="#666" text-anchor="middle">建設業にロボット</text><rect x="204" y="370" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="270.0" y="396" font-size="17" font-weight="700" text-anchor="middle">承</text><text x="270.0" y="420" font-size="13" fill="#666" text-anchor="middle">設計を軽んじる</text><rect x="348" y="370" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="414.0" y="396" font-size="17" font-weight="700" text-anchor="middle">結(先置き)</text><text x="414.0" y="420" font-size="13" fill="#666" text-anchor="middle">品質を気にしない理由</text><rect x="492" y="370" width="132" height="64" rx="8" fill="#fff1d6" stroke="#d4a017" stroke-width="1.5"/><text x="558.0" y="396" font-size="17" font-weight="700" text-anchor="middle">転(内側)</text><text x="558.0" y="420" font-size="13" fill="#666" text-anchor="middle">品質が下がる</text><rect x="636" y="370" width="132" height="64" rx="8" fill="#fff1d6" stroke="#d4a017" stroke-width="1.5"/><text x="702.0" y="396" font-size="17" font-weight="700" text-anchor="middle">転(全体)</text><text x="702.0" y="420" font-size="13" fill="#666" text-anchor="middle">実はソフトウェア</text><rect x="780" y="370" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="846.0" y="396" font-size="17" font-weight="700" text-anchor="middle">問い</text><text x="846.0" y="420" font-size="13" fill="#666" text-anchor="middle">どうすればいい?</text><rect x="924" y="370" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="990.0" y="396" font-size="17" font-weight="700" text-anchor="middle">答え</text><text x="990.0" y="420" font-size="13" fill="#666" text-anchor="middle">自動テスト</text><rect x="1068" y="370" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="1134.0" y="396" font-size="17" font-weight="700" text-anchor="middle">結び</text><text x="1134.0" y="420" font-size="13" fill="#666" text-anchor="middle">設計できる人が要る</text><text x="56" y="530" font-size="14" fill="#666">数えるもの: 役割がそろっているか / 弧の長さ(読者が答えを待つ長さ)/ 理由を先に置くか、答えを先に出すか</text><rect x="30" y="580" width="1180" height="400" rx="14" fill="none" stroke="#c9d1d6" stroke-width="2"/><text x="56" y="620" font-size="22" font-weight="700" fill="#2e8b57">文の軸 ― 1文ごとに、役割を果たしたかを評価する</text><text x="56" y="648" font-size="15" fill="#666">読者(AIと自分)に1段落ずつ読ませ、予想・驚き・納得を聞く。役割を担う文の位置で、読者に何が起きたかを見る</text><rect x="60" y="672" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="126.0" y="698" font-size="17" font-weight="700" text-anchor="middle">起</text><text x="126.0" y="722" font-size="13" fill="#666" text-anchor="middle">建設業にロボット</text><rect x="204" y="672" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="270.0" y="698" font-size="17" font-weight="700" text-anchor="middle">承</text><text x="270.0" y="722" font-size="13" fill="#666" text-anchor="middle">設計を軽んじる</text><rect x="348" y="672" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="414.0" y="698" font-size="17" font-weight="700" text-anchor="middle">結(先置き)</text><text x="414.0" y="722" font-size="13" fill="#666" text-anchor="middle">品質を気にしない理由</text><rect x="492" y="672" width="132" height="64" rx="8" fill="#fff1d6" stroke="#d4a017" stroke-width="1.5"/><text x="558.0" y="698" font-size="17" font-weight="700" text-anchor="middle">転(内側)</text><text x="558.0" y="722" font-size="13" fill="#666" text-anchor="middle">品質が下がる</text><rect x="636" y="672" width="132" height="64" rx="8" fill="#fff1d6" stroke="#d4a017" stroke-width="1.5"/><text x="702.0" y="698" font-size="17" font-weight="700" text-anchor="middle">転(全体)</text><text x="702.0" y="722" font-size="13" fill="#666" text-anchor="middle">実はソフトウェア</text><rect x="780" y="672" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="846.0" y="698" font-size="17" font-weight="700" text-anchor="middle">問い</text><text x="846.0" y="722" font-size="13" fill="#666" text-anchor="middle">どうすればいい?</text><rect x="924" y="672" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="990.0" y="698" font-size="17" font-weight="700" text-anchor="middle">答え</text><text x="990.0" y="722" font-size="13" fill="#666" text-anchor="middle">自動テスト</text><rect x="1068" y="672" width="132" height="64" rx="8" fill="#eef2f5" stroke="#9aa8b2" stroke-width="1.5"/><text x="1134.0" y="698" font-size="17" font-weight="700" text-anchor="middle">結び</text><text x="1134.0" y="722" font-size="13" fill="#666" text-anchor="middle">設計できる人が要る</text><line x1="702.0" y1="736" x2="702.0" y2="772" stroke="#2e8b57" stroke-width="2"/><rect x="638.0" y="772" width="128" height="62" rx="8" fill="#eaf5ee" stroke="#2e8b57"/><text x="702.0" y="797" font-size="14" text-anchor="middle">読者の予想は</text><text x="702.0" y="818" font-size="14" text-anchor="middle" font-weight="700">大きく動いたか</text><line x1="414.0" y1="736" x2="414.0" y2="772" stroke="#2e8b57" stroke-width="2"/><rect x="350.0" y="772" width="128" height="62" rx="8" fill="#eaf5ee" stroke="#2e8b57"/><text x="414.0" y="797" font-size="14" text-anchor="middle">転を読んだあと</text><text x="414.0" y="818" font-size="14" text-anchor="middle" font-weight="700">納得したか</text><line x1="846.0" y1="736" x2="846.0" y2="772" stroke="#2e8b57" stroke-width="2"/><rect x="782.0" y="772" width="128" height="62" rx="8" fill="#eaf5ee" stroke="#2e8b57"/><text x="846.0" y="797" font-size="14" text-anchor="middle">読者は問いを</text><text x="846.0" y="818" font-size="14" text-anchor="middle" font-weight="700">抱いたか</text><line x1="990.0" y1="736" x2="990.0" y2="772" stroke="#2e8b57" stroke-width="2"/><rect x="926.0" y="772" width="128" height="62" rx="8" fill="#eaf5ee" stroke="#2e8b57"/><text x="990.0" y="797" font-size="14" text-anchor="middle">問いは</text><text x="990.0" y="818" font-size="14" text-anchor="middle" font-weight="700">解けたか</text><line x1="126.0" y1="736" x2="126.0" y2="772" stroke="#2e8b57" stroke-width="2"/><rect x="62.0" y="772" width="128" height="62" rx="8" fill="#eaf5ee" stroke="#2e8b57"/><text x="126.0" y="797" font-size="14" text-anchor="middle">読者は予想を</text><text x="126.0" y="818" font-size="14" text-anchor="middle" font-weight="700">持てたか</text><text x="56" y="880" font-size="15">例: 転の文 → 読者の予想が、ふつうの段落の2倍以上動いたら「果たした」とみなす(仮の目安)</text><text x="56" y="908" font-size="15">例: 結の文 → 読者の過半数が「納得した」と答えたら「果たした」とみなす</text><text x="56" y="950" font-size="14" fill="#666">その文だけで意味が分かるか(1文の分かりやすさ)は、役割を果たしたかとは別に、読みやすさの側で測る</text></svg></html>
